<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#123b68">
  <title>Inventaris SMK Swasta Istiqlal Delitua</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: #18324b;
      background: linear-gradient(135deg, #eaf3ff 0%, #f7f9fc 55%, #e5effb 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .container {
      width: min(900px, 100%);
      text-align: center;
      background: #fff;
      border-radius: 22px;
      padding: clamp(32px, 6vw, 64px) clamp(22px, 5vw, 56px);
      box-shadow: 0 18px 55px rgba(20, 55, 90, .12);
      border: 1px solid #e4edf7;
    }
    .school-mark {
      width: 76px;
      height: 76px;
      margin: 0 auto 22px;
      border-radius: 20px;
      display: grid;
      place-items: center;
      color: #fff;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 1px;
      background: linear-gradient(145deg, #1e609b, #123b68);
      box-shadow: 0 9px 20px rgba(18, 59, 104, .2);
    }
    .eyebrow {
      margin: 0 0 12px;
      color: #3976aa;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    h1 {
      margin: 0 auto 16px;
      max-width: 760px;
      color: #123b68;
      font-size: clamp(25px, 4.3vw, 39px);
      line-height: 1.25;
    }
    .intro {
      max-width: 650px;
      margin: 0 auto;
      color: #62758a;
      font-size: 16px;
      line-height: 1.7;
    }
    .links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 16px;
      margin-top: 36px;
    }
    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 220px;
      padding: 16px 24px;
      border-radius: 12px;
      text-decoration: none;
      font-size: 15px;
      font-weight: 700;
      transition: transform .2s ease, box-shadow .2s ease, background .2s ease;
    }
    .button:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 22px rgba(18, 59, 104, .17);
    }
    .primary { color: #fff; background: #1769aa; }
    .primary:hover { background: #12588f; }
    .secondary {
      color: #17609b;
      background: #fff;
      border: 2px solid #1769aa;
    }
    .secondary:hover { background: #f0f7fd; }
    footer {
      margin-top: 42px;
      color: #91a0af;
      font-size: 12px;
    }
    @media (max-width: 520px) {
      .links { flex-direction: column; }
      .button { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="school-mark" aria-hidden="true">SI</div>
    <p class="eyebrow">Sistem Informasi Sekolah</p>
    <h1>SELAMAT DATANG DI APLIKASI INVENTARIS SMK SWASTA ISTIQLAL DELITUA</h1>
    <p class="intro">
      Silakan pilih salah satu tampilan demo untuk melihat sistem inventaris
      dan manajemen peminjaman alat Bengkel Teknik Komputer dan Informatika.
    </p>

    <nav class="links" aria-label="Pilihan demo aplikasi">
      <a class="button primary" href="demo_labti_peminjaman.html">DEMO SEDERHANA</a>
      <a class="button secondary" href="labtrack_ti_sistem_manajemen_peminjaman_alat_bengkel_ti">DEMO LENGKAP</a>
    </nav>

    <footer>&copy; SMK Swasta Istiqlal Delitua</footer>
  </main>
</body>
</html>
